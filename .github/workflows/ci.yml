name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Zero-dependency project: no install step required.
      - name: Syntax check
        run: |
          node --check server.mjs
          node --check scripts/build.mjs
          node --check scripts/smoke.mjs

      - name: Smoke tests (boots server, asserts API contract)
        run: npm test

      - name: Static build
        run: npm run build
